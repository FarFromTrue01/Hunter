name: Hikaye seslerini indir

on:
  push:
    branches: [main]
    paths:
      - "story/fetch/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-audio
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Sesleri indir
        run: python3 .github/fetch/fetch_audio.py
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A story/audio story/fetch
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "Hikaye sesleri eklendi"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
